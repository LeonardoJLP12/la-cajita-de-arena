<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico</title>
    <link rel="stylesheet" href="soporte.css">
    <link rel="icon" href="IMG/Logo 3 (grande).jpeg">
</head>
<body>
    <header>
        <h1>Soporte Técnico</h1>
        <p class="soporte-texto">Encuentra ayuda y soluciones a tus dudas</p>
    </header>

    <section id="contact-form" class="contact-form">
        <h2>Formulario de Contacto</h2>
        <form action="https://formsubmit.co/lacajitadearenademisspatty@gmail.com" method="POST">
            <input type="hidden" name="_next" value="https://tupagina.com/gracias.html">
            <input type="hidden" name="_captcha" value="false">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
    </section>

    <footer>
        <p>Si necesitas más ayuda, contáctanos en <a href="mailto:lacajitadearenademisspatty@gmail.com">lacajitadearenademisspatty@gmail.com</a></p>
    </footer>
</body>
</html>
